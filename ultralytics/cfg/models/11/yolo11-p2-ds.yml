# Ultralytics YOLO11 object detection model with P2/4 - P5/32 outputs, enhanced with Depth2Space and Space2Depth
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: layers, parameters, gradients, GFLOPs (to be updated)
  s: [0.50, 0.50, 1024] # summary: layers, parameters, gradients, GFLOPs (to be updated)
  m: [0.50, 1.00, 512] # summary: layers, parameters, gradients, GFLOPs (to be updated)
  l: [1.00, 1.00, 512] # summary: layers, parameters, gradients, GFLOPs (to be updated)
  x: [1.00, 1.50, 512] # summary: layers, parameters, gradients, GFLOPs (to be updated)

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 1, Space2Depth, [2]] # New: Space2Depth after P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8 (index shifted)
  - [-1, 1, Depth2Space, [2]] # New: Depth2Space after P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16 (index shifted)
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32 (index shifted)
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 11 (index shifted)
  - [-1, 2, C2PSA, [1024]] # 12 (index shifted)

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]] # cat backbone P4 (index shifted)
  - [-1, 2, C3k2, [512, False]] # 15 (index shifted)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]] # cat backbone P3 (index shifted)
  - [-1, 2, C3k2, [256, False]] # 18 (P3/8-small) (index shifted)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2 (index shifted)
  - [-1, 2, C3k2, [128, False]] # 21 (P2/4-xsmall) (index shifted)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 18], 1, Concat, [1]] # cat head P3 (index shifted)
  - [-1, 2, C3k2, [256, False]] # 24 (P3/8-small) (index shifted)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]] # cat head P4 (index shifted)
  - [-1, 2, C3k2, [512, False]] # 27 (P4/16-medium) (index shifted)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P5 (index shifted)
  - [-1, 2, C3k2, [1024, True]] # 30 (P5/32-large) (index shifted)

  - [[21, 24, 27, 30], 1, Detect, [nc]] # Detect(P2, P3, P4, P5) (index shifted)
